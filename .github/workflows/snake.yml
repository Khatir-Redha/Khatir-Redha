name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Generate both light and dark mode versions of the snake
          outputs: |
            generated/snake.svg
            generated/snake-dark.svg?palette=github-dark
            
      # The Platane/snk action doesn't automatically commit to the current branch,
      # so we use git-auto-commit-action to commit the new SVGs safely.
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update contribution snake"
          file_pattern: "generated/snake*.svg"
