name: Generate GitHub Metrics

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ─────────────────────────────────────────────
      # Step 1: Core profile metrics
      # Outputs: header, activity, community stats,
      # language breakdown, and repository summary.
      # Achievements are intentionally excluded here —
      # they are rendered as a separate widget below.
      # ─────────────────────────────────────────────
      - name: Generate Main Metrics
        uses: lowlighter/metrics@latest
        with:
          filename: generated/metrics.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: header, activity, community, repositories, metadata
          # Show language breakdown with byte size and percentage.
          # HTML and CSS are excluded — they skew results for web devs
          # since template files inflate those numbers artificially.
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: bytes-size, percentage

      # ─────────────────────────────────────────────
      # Step 2: Achievements (compact, standalone widget)
      # Placed beside the ML Journey section in the README.
      #
      # Configuration choices:
      #   display: compact      → grid layout, not a tall list.
      #                           Much more space-efficient and
      #                           visually balanced beside text.
      #   threshold: C          → only show Bronze tier and above.
      #                           Filters out trivial/automatic
      #                           achievements that add noise.
      #   ignored: (none set)   → all eligible achievements shown,
      #                           filtered naturally by threshold.
      #   secrets: yes          → hides sensitive achievement details
      #                           (e.g. sponsor data) if applicable.
      # ─────────────────────────────────────────────
      - name: Generate Achievements
        uses: lowlighter/metrics@latest
        with:
          filename: generated/metrics.achievements.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          # base: "" means no header or extra sections —
          # just the achievements plugin output, nothing else.
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_limit: 0
